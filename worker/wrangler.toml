name = "dms-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# 绑定 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "dms-db"
database_id = "a57bd321-c1ab-427e-a06d-41073992ab06"

# S3 对象存储配置（cstcloud 中国科技云）
#
# ⚠️ 安全提示：S3 访问密钥已改用 Cloudflare Secrets 管理，不再以明文写入本文件。
# 原因：原明文密钥已随代码进入 Git 历史，任何人拿到仓库即可直接操作存储桶。
#
# 【部署前必做】在 worker/ 目录下执行以下命令写入密钥（交互式输入，不会落盘到文件）：
#   npx wrangler secret put S3_ACCESS_KEY
#   npx wrangler secret put S3_SECRET_KEY
#
# 若未配置 Secret 就执行 wrangler deploy，云端将无法访问 S3（图片上传/下载失效）。
# 另建议在 cstcloud 控制台轮换这对密钥，旧密钥视为已泄露。
#
[vars]
S3_ENDPOINT = "https://s3.cstcloud.cn"
S3_BUCKET = "4e76329535754d69938766237acfe5f3"
S3_PUBLIC_URL = "https://s3.cstcloud.cn/4e76329535754d69938766237acfe5f3"
S3_REGION = "us-east-1"
